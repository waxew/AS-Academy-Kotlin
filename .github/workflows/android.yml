name: Android App
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Validate course
        run: python3 tools/validate_course.py
      - name: Sync course assets
        run: |
          mkdir -p app/src/main/assets/course/kotlin
          cp course/manifest.json course/levels.json course/chapters.json app/src/main/assets/course/kotlin/
          cp -R course/lessons course/exercises course/quizzes course/projects course/glossary app/src/main/assets/course/kotlin/
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
