name: Validate Course Package
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          find course -name '*.json' -print0 | while IFS= read -r -d '' file; do
            echo "Validating $file"
            jq empty "$file"
          done

      - name: Required package structure
        shell: bash
        run: |
          test -f course/manifest.json
          test -f course/course.json
          test -f course/levels.json
          test -f course/chapters.json
          test -d course/lessons
          test -d course/exercises
          test -d course/quizzes
          test -d course/projects
          test -d course/glossary
          test -d course/branding

      - name: Stable IDs and references
        run: python3 tools/validate_course.py
