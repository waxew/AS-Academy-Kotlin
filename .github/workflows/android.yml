name: Android App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.AS_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.AS_RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.AS_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.AS_RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate course
        run: python3 tools/validate_course.py

      - name: Sync complete course package into Android assets
        run: |
          rm -rf app/src/main/assets/course/kotlin
          mkdir -p app/src/main/assets/course/kotlin
          cp -R course/. app/src/main/assets/course/kotlin/

      - name: Run Android lint
        run: gradle :app:lintDebug

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Prepare permanent release signing
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/as-academy-release.jks"
          echo "AS_RELEASE_STORE_FILE=$RUNNER_TEMP/as-academy-release.jks" >> "$GITHUB_ENV"
          echo "AS_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AS_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "AS_RELEASE_SIGNING_ENABLED=true" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Verify signed release identity
        if: ${{ env.AS_RELEASE_SIGNING_ENABLED == 'true' }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/signature-verification.txt

      - name: Generate checksums
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0 | while IFS= read -r -d '' file; do
            sha256sum "$file" > "$file.sha256"
          done
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/app-release.aab.sha256
          fi

      - name: Write release metadata
        run: |
          mkdir -p app/build/outputs/release-metadata
          {
            echo "versionName=1.2.0"
            echo "versionCode=12000"
            echo "commit=${GITHUB_SHA}"
            echo "signed=${AS_RELEASE_SIGNING_ENABLED:-false}"
          } > app/build/outputs/release-metadata/release-info.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-debug-1.2.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-release-1.2.0
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/apk/release/signature-verification.txt
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.sha256
            app/build/outputs/release-metadata/release-info.txt

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-lint
          if-no-files-found: ignore
          path: app/build/reports/lint-results-debug.html
