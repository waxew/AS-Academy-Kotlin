name: Android App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate course
        run: python3 tools/validate_course.py

      - name: Sync course assets
        run: |
          mkdir -p app/src/main/assets/course/kotlin
          cp course/manifest.json course/levels.json course/chapters.json app/src/main/assets/course/kotlin/
          cp -R course/lessons course/exercises course/quizzes course/projects course/glossary app/src/main/assets/course/kotlin/

      # Quality gate: fail the build if Android lint or JVM unit tests fail.
      - name: Run Android lint
        run: gradle :app:lintDebug

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      # Build an unsigned release candidate. Final publish signing stays outside source control.
      - name: Build release candidate
        run: gradle :app:assembleRelease

      - name: Generate checksums
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-release-unsigned
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-lint
          if-no-files-found: ignore
          path: app/build/reports/lint-results-debug.html
