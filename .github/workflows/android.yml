name: Android App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate course
        run: python3 tools/validate_course.py

      - name: Sync course assets
        run: |
          mkdir -p app/src/main/assets/course/kotlin
          cp course/manifest.json course/levels.json course/chapters.json app/src/main/assets/course/kotlin/
          cp -R course/lessons course/exercises course/quizzes course/projects course/glossary app/src/main/assets/course/kotlin/

      - name: Run Android lint
        run: gradle :app:lintDebug

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      # Produces an unsigned candidate until the persistent publish keystore is configured.
      - name: Build release candidate APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Generate checksums
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          fi
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/app-release.aab.sha256
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-release-candidate
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.sha256

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Kotlin-lint
          if-no-files-found: ignore
          path: app/build/reports/lint-results-debug.html
